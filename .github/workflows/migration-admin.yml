name: Migration Admin Tooling

on:
  workflow_dispatch:
    inputs:
      tool_ref:
        description: 'Git ref containing reviewed migration tooling files'
        required: true
        default: 'baseline/production-host-20260812'
      mode:
        description: 'Diagnose FTPS paths or upload reviewed tooling'
        required: true
        default: 'diagnose'
        type: choice
        options:
          - diagnose
          - upload
      target_root:
        description: 'Whitelisted remote root for upload mode'
        required: true
        default: 'app-root'
        type: choice
        options:
          - app-root
          - sibling-public-html
          - public-html-child

concurrency:
  group: migration-admin-tooling
  cancel-in-progress: false

jobs:
  upload-migration-tooling:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout selected tooling ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tool_ref }}

      - name: Validate FTP secrets
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          missing=0
          for name in FTP_SERVER FTP_USERNAME FTP_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is missing."
              missing=1
            fi
          done
          exit "$missing"

      - name: Validate migration tooling
        shell: bash
        run: |
          php -l app/Services/TenantMigrationService.php
          php -l tools/tenant_migrate.php
          php tests/tenant-migration-service.test.php

          if ! grep -q "PHP_SAPI !== 'cli'" tools/tenant_migrate.php; then
            echo "::error::tools/tenant_migrate.php must be CLI-only."
            exit 1
          fi
          if ! grep -q "service->audit(\$pdo, true)" tools/tenant_migrate.php; then
            echo "::error::Default tenant migration audit must call read-only audit mode."
            exit 1
          fi

      - name: Build whitelisted admin tooling payload
        shell: bash
        run: |
          rm -rf dist/migration-admin dist/migration-admin-manifest
          mkdir -p dist/migration-admin/app/Services dist/migration-admin/tools
          mkdir -p dist/migration-admin-manifest
          cp app/Services/TenantMigrationService.php dist/migration-admin/app/Services/TenantMigrationService.php
          cp tools/tenant_migrate.php dist/migration-admin/tools/tenant_migrate.php

          mapfile -t payload < <(find dist/migration-admin -type f | sort)
          if [ "${#payload[@]}" -ne 2 ]; then
            echo "::error::Migration admin payload must contain exactly 2 files."
            printf '%s\n' "${payload[@]}"
            exit 1
          fi

          expected=$'dist/migration-admin/app/Services/TenantMigrationService.php\ndist/migration-admin/tools/tenant_migrate.php'
          actual="$(printf '%s\n' "${payload[@]}")"
          if [ "$actual" != "$expected" ]; then
            echo "::error::Migration admin payload contains non-whitelisted files."
            printf '%s\n' "${payload[@]}"
            exit 1
          fi

          sha256sum "${payload[@]}" | tee dist/migration-admin-manifest/SHA256SUMS.txt

      - name: Upload payload manifest for audit
        uses: actions/upload-artifact@v4
        with:
          name: migration-admin-tooling-manifest
          path: dist/migration-admin-manifest/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Diagnose FTPS production roots
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python - <<'PY'
          import hashlib
          import os
          from ftplib import FTP_TLS, error_perm

          candidates = ['.', 'public_html', '../public_html']
          files = [
              'app/Services/TenantMigrationService.php',
              'tools/tenant_migrate.php',
          ]
          markers = [
              b'tenant-audit-actual-schema-20260812-v2',
              b'--self-test-json',
              b'actualSchemaAudit',
              b'livestockAudit',
              b'livestockMigrationCompatibility',
          ]

          def read_file(ftp: FTP_TLS, base: str, rel: str):
              chunks = []
              path = f'{base.rstrip("/")}/{rel}' if base != '.' else rel
              ftp.retrbinary(f'RETR {path}', chunks.append)
              return b''.join(chunks)

          with FTP_TLS(os.environ['FTP_SERVER'], timeout=60) as ftp:
              ftp.login(os.environ['FTP_USERNAME'], os.environ['FTP_PASSWORD'])
              ftp.prot_p()
              ftp.set_pasv(True)
              login_root = ftp.pwd()
              print(f'ftp_login_pwd={login_root}')
              for candidate in candidates:
                  print(f'candidate={candidate}')
                  try:
                      ftp.cwd(login_root)
                      ftp.cwd(candidate)
                      print(f'  pwd={ftp.pwd()}')
                      names = sorted(ftp.nlst())[:40]
                      print('  entries=' + ','.join(names))
                  except Exception as exc:
                      print(f'  list_error={exc.__class__.__name__}: {exc}')
                  finally:
                      try:
                          ftp.cwd(login_root)
                      except Exception:
                          pass

                  for rel in files:
                      try:
                          data = read_file(ftp, candidate, rel)
                      except error_perm as exc:
                          print(f'  {rel}: missing_or_denied={exc}')
                          continue
                      except Exception as exc:
                          print(f'  {rel}: read_error={exc.__class__.__name__}: {exc}')
                          continue
                      sha = hashlib.sha256(data).hexdigest()
                      found = [m.decode('ascii') for m in markers if m in data]
                      print(f'  {rel}: sha256={sha}; bytes={len(data)}; markers={found}')
          PY

      - name: Upload and verify whitelisted migration tooling via FTPS
        if: ${{ inputs.mode == 'upload' }}
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          TARGET_ROOT: ${{ inputs.target_root }}
        run: |
          python - <<'PY'
          import hashlib
          import io
          import os
          from ftplib import FTP_TLS
          from pathlib import Path

          roots = {
              'app-root': '.',
              'sibling-public-html': '../public_html',
              'public-html-child': 'public_html',
          }
          root_choice = os.environ['TARGET_ROOT']
          if root_choice not in roots:
              raise SystemExit(f'Unsupported target_root: {root_choice}')
          target_root = roots[root_choice].rstrip('/')

          files = [
              ('dist/migration-admin/app/Services/TenantMigrationService.php', f'{target_root}/app/Services/TenantMigrationService.php' if target_root != '.' else 'app/Services/TenantMigrationService.php'),
              ('dist/migration-admin/tools/tenant_migrate.php', f'{target_root}/tools/tenant_migrate.php' if target_root != '.' else 'tools/tenant_migrate.php'),
          ]
          expected = {
              remote: hashlib.sha256(Path(local).read_bytes()).hexdigest()
              for local, remote in files
          }

          def ensure_dir(ftp: FTP_TLS, root: str, directory: str) -> None:
              ftp.cwd(root)
              for part in directory.split('/'):
                  if not part or part == '.':
                      continue
                  if part == '..':
                      ftp.cwd('..')
                      continue
                  try:
                      ftp.cwd(part)
                  except Exception:
                      ftp.mkd(part)
                      ftp.cwd(part)
              ftp.cwd(root)

          with FTP_TLS(os.environ['FTP_SERVER'], timeout=60) as ftp:
              ftp.login(os.environ['FTP_USERNAME'], os.environ['FTP_PASSWORD'])
              ftp.prot_p()
              ftp.set_pasv(True)
              root = ftp.pwd()
              for local, remote in files:
                  remote_dir, remote_name = remote.rsplit('/', 1)
                  ensure_dir(ftp, root, remote_dir)
                  ftp.cwd(root)
                  ftp.cwd(remote_dir)
                  with open(local, 'rb') as handle:
                      ftp.storbinary(f'STOR {remote_name}', handle)
                  print(f'uploaded {remote}')

              for _, remote in files:
                  remote_dir, remote_name = remote.rsplit('/', 1)
                  ftp.cwd(root)
                  ftp.cwd(remote_dir)
                  buf = io.BytesIO()
                  ftp.retrbinary(f'RETR {remote_name}', buf.write)
                  actual = hashlib.sha256(buf.getvalue()).hexdigest()
                  if actual != expected[remote]:
                      raise SystemExit(f'hash mismatch for {remote}: expected {expected[remote]} got {actual}')
                  print(f'verified {remote} sha256={actual}')
          PY