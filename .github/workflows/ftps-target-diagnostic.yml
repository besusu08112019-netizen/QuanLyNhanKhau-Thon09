name: FTPS Target Diagnostic

# Diagnostic-only workflow. It reads existing FTPS/HTTP files and never writes production application files.

on:
  workflow_dispatch:
  push:
    branches:
      - diagnostic/ftps-target-20260911
    paths:
      - '.github/workflows/ftps-target-diagnostic.yml'

jobs:
  trace-ftps-target:
    runs-on: ubuntu-latest
    environment: production
    env:
      EXPECTED_HTTP_SW_SHA: 27aac07fedf83a7b1b13910a681d6eca2f548a909b9cfb51cb1b05acb37cba0a
      EXPECTED_HTTP_CSS_SHA: c87512933a57285f40d7eb2b2d0675b586e4f7ff450fea830216c74e9b487665
      EXPECTED_HTTP_QPAN_JS_SHA: 343bc43bbd855073470dd7f18a422021b6459e220b7525e928eba2ac5d8efdd1
      EXPECTED_CANDIDATE_SW_SHA: 580a0569831bf107e21c94032621624eda7d2b6b870ff70820c53bba740f3834
      EXPECTED_CANDIDATE_CSS_SHA: 5f75ce156dee720cc702395bbf09c94a783f905ecc3677235efbd33f1809589d
      EXPECTED_CANDIDATE_QPAN_JS_SHA: 19427547b1576b5d6f8bba3e235958fb6aac1356d2a1da3306b541410913dec1
      HTTP_ROOT_URLS: https://hongphongnb.com,https://thon09.hongphongnb.com,https://thon10.hongphongnb.com

    steps:
      - name: Trace FTPS target identity
        id: trace
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python - <<'PY'
          import hashlib
          import io
          import json
          import os
          import sys
          import time
          import urllib.request
          from ftplib import FTP_TLS

          server = os.environ['FTP_SERVER']
          username = os.environ['FTP_USERNAME']
          password = os.environ['FTP_PASSWORD']
          expected_http_sha = {
              'service-worker.js': os.environ['EXPECTED_HTTP_SW_SHA'],
              'assets/css/app.min.css': os.environ['EXPECTED_HTTP_CSS_SHA'],
              'assets/js/defense-security.min.js': os.environ['EXPECTED_HTTP_QPAN_JS_SHA'],
          }
          http_roots = [item.strip().rstrip('/') for item in os.environ['HTTP_ROOT_URLS'].split(',') if item.strip()]
          candidate_sha = {
              'service-worker.js': os.environ['EXPECTED_CANDIDATE_SW_SHA'],
              'assets/css/app.min.css': os.environ['EXPECTED_CANDIDATE_CSS_SHA'],
              'assets/js/defense-security.min.js': os.environ['EXPECTED_CANDIDATE_QPAN_JS_SHA'],
          }
          files = [
              'service-worker.js',
              'assets/css/app.min.css',
              'assets/js/defense-security.min.js',
          ]
          paths = ['/']

          def sha256(data):
              return hashlib.sha256(data).hexdigest()

          def fetch(url):
              request = urllib.request.Request(
                  url + ('&' if '?' in url else '?') + 'diag=' + str(int(time.time())),
                  headers={'Cache-Control': 'no-cache', 'Pragma': 'no-cache', 'User-Agent': 'github-actions-ftps-diagnostic'},
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return response.status, response.read(), dict(response.headers.items())

          def safe_names(names):
              allowed = {'public_html', 'assets', 'app', 'api', 'config', 'views', 'service-worker.js', 'index.php'}
              return sorted(name.rstrip('/') for name in names if name.rstrip('/') in allowed)

          def ftp_read(ftp, name):
              buf = io.BytesIO()
              ftp.retrbinary('RETR ' + name, buf.write)
              return buf.getvalue()

          http = {}
          for base in http_roots:
              http[base] = {}
              for rel in files:
                  status, body, headers = fetch(f'{base}/{rel}')
                  http[base][rel] = {
                      'status': status,
                      'sha256': sha256(body),
                      'last_modified': headers.get('Last-Modified'),
                      'cache_control': headers.get('Cache-Control'),
                      'server': headers.get('Server'),
                      'cf_cache_status': headers.get('CF-Cache-Status'),
                      'age': headers.get('Age'),
                      'via': headers.get('Via'),
                      'x_cache': headers.get('X-Cache'),
                  }

          report = {
              'ftp_server_host_only': server,
              'ftp_user_fingerprint_pass': username == 'githubdeploy@hongphongnb.com',
              'ftp_session_pwd': None,
              'ftp_login_ok': False,
              'ftp_error': None,
              'paths': [],
              'http': http,
              'matches': [],
          }

          try:
              with FTP_TLS(server, timeout=30) as ftp:
                  ftp.login(username, password)
                  report['ftp_login_ok'] = True
                  ftp.prot_p()
                  report['ftp_session_pwd'] = ftp.pwd()
                  for target in paths:
                      entry = {'target': target, 'cwd_ok': False, 'pwd': None, 'listing_contract': {}, 'files': {}}
                      try:
                          ftp.cwd('/')
                          ftp.cwd(target)
                          entry['cwd_ok'] = True
                          entry['pwd'] = ftp.pwd()
                          names = safe_names(ftp.nlst())
                          entry['listing_contract'] = {
                              'safe_names': names,
                              'has_public_html': 'public_html' in names,
                              'has_assets': 'assets' in names,
                              'has_app': 'app' in names,
                              'has_views': 'views' in names,
                              'has_service_worker': 'service-worker.js' in names,
                              'has_index': 'index.php' in names,
                          }
                          for rel in files:
                              try:
                                  data = ftp_read(ftp, rel)
                                  file_sha = sha256(data)
                                  entry['files'][rel] = {
                                      'exists': True,
                                      'sha256': file_sha,
                                      'bytes': len(data),
                                      'matches_http_root': file_sha == http['https://hongphongnb.com'][rel]['sha256'],
                                      'matches_candidate': file_sha == candidate_sha[rel],
                                  }
                                  root_sha = http['https://hongphongnb.com'][rel]['sha256']
                                  if file_sha == root_sha:
                                      report['matches'].append({'ftp_target': target, 'ftp_pwd': entry['pwd'], 'file': rel, 'matches_http_root': True})
                              except Exception as exc:
                                  entry['files'][rel] = {'exists': False, 'error': str(exc).splitlines()[0][:120]}
                      except Exception as exc:
                          entry['error'] = str(exc).splitlines()[0][:160]
                      report['paths'].append(entry)
          except Exception as exc:
              report['ftp_error'] = str(exc).splitlines()[0][:160]

          ftp_root = next((item for item in report['paths'] if item['target'] == '/' and item.get('cwd_ok')), None)
          identity_by_file = {}
          if ftp_root:
              for rel in files:
                  ftp_file = ftp_root['files'].get(rel, {})
                  http_sha = http['https://hongphongnb.com'][rel]['sha256']
                  identity_by_file[rel] = (
                      ftp_file.get('exists') is True
                      and ftp_file.get('sha256') == http_sha
                      and http_sha == expected_http_sha[rel]
                  )
          else:
              identity_by_file = {rel: False for rel in files}
          report['identity_by_file'] = identity_by_file
          report['three_file_identity'] = all(identity_by_file.values())
          report['identity_proven_by_existing_service_worker'] = identity_by_file.get('service-worker.js', False)
          report['probe_write'] = 0
          report['host_application_write'] = 0
          report['db_write'] = 0
          print(json.dumps(report, indent=2, sort_keys=True))
          compact = {
              'ftp_session_pwd': report['ftp_session_pwd'],
              'ftp_user_fingerprint_pass': report['ftp_user_fingerprint_pass'],
              'ftp_login_ok': report['ftp_login_ok'],
              'ftp_error': report['ftp_error'],
              'paths': [
                  {
                      'target': item['target'],
                      'cwd_ok': item['cwd_ok'],
                      'pwd': item['pwd'],
                      'listing_contract': item['listing_contract'],
                      'files': item['files'],
                      **({'error': item['error']} if 'error' in item else {}),
                  }
                  for item in report['paths']
              ],
              'http_root': http['https://hongphongnb.com'],
              'matches': report['matches'],
              'identity_by_file': report['identity_by_file'],
              'three_file_identity': report['three_file_identity'],
              'identity_proven_by_existing_service_worker': report['identity_proven_by_existing_service_worker'],
              'probe_write': 0,
              'host_application_write': 0,
              'db_write': 0,
          }
          with open('ftps-diagnostic-report.json', 'w', encoding='utf-8') as handle:
              json.dump(report, handle, indent=2, sort_keys=True)
          print('::warning title=FTPS_DIAGNOSTIC_RESULT::' + json.dumps(compact, sort_keys=True))
          print('identity_proven=' + ('true' if report['three_file_identity'] else 'false'))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              handle.write('identity_proven=' + ('true' if report['three_file_identity'] else 'false') + '\n')
          PY

      - name: Upload sanitized diagnostic report
        uses: actions/upload-artifact@v4
        with:
          name: ftps-diagnostic-report
          path: ftps-diagnostic-report.json
          if-no-files-found: error
          retention-days: 3

      - name: Enforce FTPS and HTTP identity proof
        if: steps.trace.outputs.identity_proven != 'true'
        shell: bash
        run: |
          echo "::error::FTP / does not have all three required files byte-identical to current HTTP root."
          exit 1
