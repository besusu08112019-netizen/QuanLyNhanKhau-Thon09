name: Migration Admin Tooling

on:
  workflow_dispatch:
    inputs:
      tool_ref:
        description: 'Git ref containing reviewed migration tooling files'
        required: true
        default: 'baseline/production-host-20260812'

concurrency:
  group: migration-admin-tooling
  cancel-in-progress: false

jobs:
  upload-migration-tooling:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout selected tooling ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tool_ref }}

      - name: Validate FTP secrets
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          missing=0
          for name in FTP_SERVER FTP_USERNAME FTP_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is missing."
              missing=1
            fi
          done
          exit "$missing"

      - name: Validate migration tooling
        shell: bash
        run: |
          php -l app/Services/TenantMigrationService.php
          php -l tools/tenant_migrate.php
          php tests/tenant-migration-service.test.php

          if ! grep -q "PHP_SAPI !== 'cli'" tools/tenant_migrate.php; then
            echo "::error::tools/tenant_migrate.php must be CLI-only."
            exit 1
          fi
          if ! grep -q "service->audit(\$pdo, true)" tools/tenant_migrate.php; then
            echo "::error::Default tenant migration audit must call read-only audit mode."
            exit 1
          fi

      - name: Build whitelisted admin tooling payload
        shell: bash
        run: |
          rm -rf dist/migration-admin dist/migration-admin-manifest
          mkdir -p dist/migration-admin/app/Services dist/migration-admin/tools
          mkdir -p dist/migration-admin-manifest
          cp app/Services/TenantMigrationService.php dist/migration-admin/app/Services/TenantMigrationService.php
          cp tools/tenant_migrate.php dist/migration-admin/tools/tenant_migrate.php

          mapfile -t payload < <(find dist/migration-admin -type f | sort)
          if [ "${#payload[@]}" -ne 2 ]; then
            echo "::error::Migration admin payload must contain exactly 2 files."
            printf '%s\n' "${payload[@]}"
            exit 1
          fi

          expected=$'dist/migration-admin/app/Services/TenantMigrationService.php\ndist/migration-admin/tools/tenant_migrate.php'
          actual="$(printf '%s\n' "${payload[@]}")"
          if [ "$actual" != "$expected" ]; then
            echo "::error::Migration admin payload contains non-whitelisted files."
            printf '%s\n' "${payload[@]}"
            exit 1
          fi

          sha256sum "${payload[@]}" | tee dist/migration-admin-manifest/SHA256SUMS.txt

      - name: Upload payload manifest for audit
        uses: actions/upload-artifact@v4
        with:
          name: migration-admin-tooling-manifest
          path: dist/migration-admin-manifest/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload and verify whitelisted migration tooling via FTPS
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python - <<'PY'
          import hashlib
          import io
          import os
          from ftplib import FTP_TLS
          from pathlib import Path

          files = [
              ('dist/migration-admin/app/Services/TenantMigrationService.php', '../public_html/app/Services/TenantMigrationService.php'),
              ('dist/migration-admin/tools/tenant_migrate.php', '../public_html/tools/tenant_migrate.php'),
          ]
          expected = {
              remote: hashlib.sha256(Path(local).read_bytes()).hexdigest()
              for local, remote in files
          }

          def ensure_dir(ftp: FTP_TLS, directory: str) -> None:
              current = ftp.pwd()
              try:
                  for part in directory.split('/'):
                      if not part or part == '.':
                          continue
                      if part == '..':
                          ftp.cwd('..')
                          continue
                      try:
                          ftp.cwd(part)
                      except Exception:
                          ftp.mkd(part)
                          ftp.cwd(part)
              finally:
                  ftp.cwd(current)

          with FTP_TLS(os.environ['FTP_SERVER'], timeout=60) as ftp:
              ftp.login(os.environ['FTP_USERNAME'], os.environ['FTP_PASSWORD'])
              ftp.prot_p()
              ftp.set_pasv(True)
              for local, remote in files:
                  remote_dir, remote_name = remote.rsplit('/', 1)
                  ensure_dir(ftp, remote_dir)
                  ftp.cwd(remote_dir)
                  with open(local, 'rb') as handle:
                      ftp.storbinary(f'STOR {remote_name}', handle)
                  print(f'uploaded {remote}')

              for _, remote in files:
                  remote_dir, remote_name = remote.rsplit('/', 1)
                  ftp.cwd(remote_dir)
                  buf = io.BytesIO()
                  ftp.retrbinary(f'RETR {remote_name}', buf.write)
                  actual = hashlib.sha256(buf.getvalue()).hexdigest()
                  if actual != expected[remote]:
                      raise SystemExit(f'hash mismatch for {remote}: expected {expected[remote]} got {actual}')
                  print(f'verified {remote} sha256={actual}')
          PY