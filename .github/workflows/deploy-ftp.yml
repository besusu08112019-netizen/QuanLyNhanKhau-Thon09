name: Deploy to FTP

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/**'
  workflow_dispatch:

concurrency:
  group: production-ftp
  cancel-in-progress: false

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate production secrets
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          TENANT_PARITY_LOGIN_JSON: ${{ secrets.TENANT_PARITY_LOGIN_JSON }}
          DB_HOST: ${{ secrets.DB_HOST || vars.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT || vars.DB_PORT }}
          DB_DATABASE: ${{ secrets.DB_DATABASE || vars.DB_DATABASE }}
          DB_USERNAME: ${{ secrets.DB_USERNAME || vars.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_CHARSET: ${{ secrets.DB_CHARSET || vars.DB_CHARSET }}
        run: |
          missing=0
          for name in FTP_SERVER FTP_USERNAME FTP_PASSWORD DB_HOST DB_DATABASE DB_USERNAME DB_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is missing. Add it as a GitHub Actions secret, or add non-sensitive DB values as repository/environment variables. DB_PASSWORD must be a secret."
              missing=1
            fi
          done
          if [ -z "${TENANT_PARITY_LOGIN_JSON}" ]; then
            echo "::error::TENANT_PARITY_LOGIN_JSON is missing. Add per-tenant smoke-login credentials for post-deploy acceptance."
            missing=1
          fi
          exit "$missing"

      - name: Setup PHP for deployment checks
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, json
          coverage: none

      - name: Create deploy database env file
        shell: bash
        env:
          DB_HOST: ${{ secrets.DB_HOST || vars.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT || vars.DB_PORT }}
          DB_SOCKET: ${{ secrets.DB_SOCKET || vars.DB_SOCKET }}
          DB_DATABASE: ${{ secrets.DB_DATABASE || vars.DB_DATABASE }}
          DB_USERNAME: ${{ secrets.DB_USERNAME || vars.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_CHARSET: ${{ secrets.DB_CHARSET || vars.DB_CHARSET }}
        run: |
          {
            echo "DB_HOST=${DB_HOST}"
            echo "DB_PORT=${DB_PORT:-3306}"
            if [ -n "${DB_SOCKET}" ]; then echo "DB_SOCKET=${DB_SOCKET}"; fi
            echo "DB_DATABASE=${DB_DATABASE}"
            echo "DB_USERNAME=${DB_USERNAME}"
            echo "DB_PASSWORD=${DB_PASSWORD}"
            echo "DB_CHARSET=${DB_CHARSET:-utf8mb4}"
          } > .deploy.env

      - name: Run pre-deploy checks
        run: |
          npm run check:js
          npm run test:platform
          npm run test:navigation-cleanup
          node tests/security-regression.test.js
          find . -path './dist' -prune -o -path './node_modules' -prune -o -path './vendor' -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Bust frontend asset cache
        shell: bash
        env:
          ASSET_VERSION: deploy-${{ github.run_number }}-${{ github.run_attempt }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ['ASSET_VERSION']
          index_path = Path('index.php')
          text = index_path.read_text(encoding='utf-8')
          updated = re.sub(
              r"define\('APP_ASSET_VERSION',\s*'[^']+'\);",
              f"define('APP_ASSET_VERSION', '{version}');",
              text,
              count=1,
          )
          if updated == text:
              raise SystemExit('APP_ASSET_VERSION was not found in index.php')
          index_path.write_text(updated, encoding='utf-8')
          print(f'Updated APP_ASSET_VERSION to {version}')
          PY

      - name: Build minimal production artifact
        run: npm run build:production

      - name: Validate production artifact
        run: npm run validate:artifact

      - name: Upload production artifact for audit
        uses: actions/upload-artifact@v4
        with:
          name: production-artifact
          path: dist/production/
          if-no-files-found: error
          retention-days: 14

      - name: Create production env
        shell: bash
        env:
          DB_HOST: ${{ secrets.DB_HOST || vars.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT || vars.DB_PORT }}
          DB_SOCKET: ${{ secrets.DB_SOCKET || vars.DB_SOCKET }}
          DB_DATABASE: ${{ secrets.DB_DATABASE || vars.DB_DATABASE }}
          DB_USERNAME: ${{ secrets.DB_USERNAME || vars.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_CHARSET: ${{ secrets.DB_CHARSET || vars.DB_CHARSET }}
        run: |
          {
            echo "APP_NAME=HONG PHONG COMMUNITY PLATFORM"
            echo "APP_URL=https://hongphongnb.com"
            echo "DB_HOST=${DB_HOST}"
            echo "DB_PORT=${DB_PORT:-3306}"
            if [ -n "${DB_SOCKET}" ]; then echo "DB_SOCKET=${DB_SOCKET}"; fi
            echo "DB_DATABASE=${DB_DATABASE}"
            echo "DB_USERNAME=${DB_USERNAME}"
            echo "DB_PASSWORD=${DB_PASSWORD}"
            echo "DB_CHARSET=${DB_CHARSET:-utf8mb4}"
            echo "PLATFORM_ADMIN_ENABLED=true"
            echo "PLATFORM_ADMIN_DOMAINS=hongphongnb.com,admin.hongphongnb.com"
            echo "PLATFORM_DEFAULT_PORTAL=TENANT"
            echo "PLATFORM_TENANT_DOMAIN_PATTERN={code}.hongphongnb.com"
          } > dist/production/.env

      - name: Deploy to hosting via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist/production/
          server-dir: ../public_html/
          state-name: .ftp-deploy-control-center-state.json
          log-level: verbose
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            config/database.php
            storage/cache/**
            !storage/.htaccess
            backups/**

      - name: Deploy to Thon 09 via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist/production/
          server-dir: ../thon09.hongphongnb.com/
          state-name: .ftp-deploy-thon09-state.json
          log-level: verbose
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .env
            config/database.php
            storage/cache/**
            storage/logs/**
            storage/sessions/**
            uploads/**
            backups/**

      - name: Deploy to Thon 10 via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist/production/
          server-dir: ../thon10.hongphongnb.com/
          state-name: .ftp-deploy-thon10-state.json
          log-level: verbose
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .env
            config/database.php
            storage/cache/**
            storage/logs/**
            storage/sessions/**
            uploads/**
            backups/**
      - name: Verify public_html deployment
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python - <<'PY'
          import os
          import sys
          from ftplib import FTP_TLS

          required = {'.htaccess', 'index.php', 'app', 'assets', 'api', 'config', 'views'}
          server = os.environ['FTP_SERVER']
          username = os.environ['FTP_USERNAME']
          password = os.environ['FTP_PASSWORD']

          with FTP_TLS(server, timeout=30) as ftp:
              ftp.login(username, password)
              ftp.prot_p()
              ftp.cwd('../public_html')
              names = sorted(ftp.nlst())

          print('public_html contents:')
          for name in names:
              print(f'- {name}')

          normalized = {name.rstrip('/') for name in names}
          missing = sorted(required - normalized)
          if missing:
              print('Missing required public_html entries: ' + ', '.join(missing), file=sys.stderr)
              sys.exit(1)
          if normalized <= {'.well-known'}:
              print('public_html only contains .well-known', file=sys.stderr)
              sys.exit(1)
          PY

      - name: Verify all tenants received the deployed source
        shell: bash
        env:
          TENANT_PARITY_URLS: ${{ vars.TENANT_PARITY_URLS || 'https://thon09.hongphongnb.com,https://thon10.hongphongnb.com,https://ccc01.hongphongnb.com' }}
          TENANT_PARITY_LOGIN_JSON: ${{ secrets.TENANT_PARITY_LOGIN_JSON }}
          TENANT_PARITY_REQUIRE_LOGIN: '1'
          TENANT_PARITY_REQUIRED_MODULES: ${{ vars.TENANT_PARITY_REQUIRED_MODULES }}
        run: php tools/tenant_parity_check.php
