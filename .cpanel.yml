---
deployment:
  tasks:
    - export DEPLOYPATH=/home/nhhon5mp/public_html
    - /bin/mkdir -p $DEPLOYPATH
    - /bin/mkdir -p "$DEPLOYPATH/uploads" "$DEPLOYPATH/storage/logs" "$DEPLOYPATH/storage/cache" "$DEPLOYPATH/storage/sessions" "$DEPLOYPATH/storage/install-sessions" "$DEPLOYPATH/storage/install-locks"
    - /bin/tar --exclude='./.git' --exclude='./.github' --exclude='./.cpanel.yml' --exclude='./.env' --exclude='./.env.*' --exclude='./node_modules' --exclude='./tests' --exclude='./test-results' --exclude='./playwright-report' --exclude='./backups' --exclude='./storage/logs' --exclude='./storage/cache' --exclude='./storage/sessions' --exclude='./storage/install-sessions' --exclude='./storage/install-locks' --exclude='./config/database.php' --exclude='./config/database.local.php' --exclude='./installed.lock' --exclude='./uploads' -cf - . | /bin/tar -xf - -C "$DEPLOYPATH"
    - /bin/sh -c "if [ -f \"$DEPLOYPATH/.env\" ]; then if /bin/grep -q '^PLATFORM_ADMIN_ENABLED=' \"$DEPLOYPATH/.env\"; then /bin/sed -i 's/^PLATFORM_ADMIN_ENABLED=.*/PLATFORM_ADMIN_ENABLED=false/' \"$DEPLOYPATH/.env\"; else /bin/printf '\nPLATFORM_ADMIN_ENABLED=false\n' >> \"$DEPLOYPATH/.env\"; fi; fi"
    - /bin/sh -c "if [ -f \"$DEPLOYPATH/.env\" ]; then if /bin/grep -q '^PLATFORM_DEFAULT_PORTAL=' \"$DEPLOYPATH/.env\"; then /bin/sed -i 's/^PLATFORM_DEFAULT_PORTAL=.*/PLATFORM_DEFAULT_PORTAL=PUBLIC/' \"$DEPLOYPATH/.env\"; else /bin/printf 'PLATFORM_DEFAULT_PORTAL=PUBLIC\n' >> \"$DEPLOYPATH/.env\"; fi; fi"
    - /usr/bin/find "$DEPLOYPATH" -type d -exec /bin/chmod 755 {} \;
    - /usr/bin/find "$DEPLOYPATH" -type f -exec /bin/chmod 644 {} \;
    - /usr/bin/test -f "$DEPLOYPATH/index.php"
    - /usr/bin/test -f "$DEPLOYPATH/.htaccess"
    - /usr/bin/test -d "$DEPLOYPATH/app"
    - /usr/bin/test -d "$DEPLOYPATH/assets"
    - /usr/bin/test -d "$DEPLOYPATH/api"
    - /usr/bin/test -d "$DEPLOYPATH/views"
    - /bin/ls -la "$DEPLOYPATH"
